<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CDP App | Season X</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#000000">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #000000; color: #f1f5f9; display: flex; flex-direction: column; align-items: center; padding: 16px; }
        
        .header { text-align: center; margin-bottom: 20px; width: 100%; max-width: 600px; }
        .header h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; }
        .header p { color: #94a3b8; font-size: 0.85rem; margin-top: 4px; }
        
        .action-buttons { display: flex; gap: 10px; margin-bottom: 16px; width: 100%; max-width: 600px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 700; cursor: pointer; color: #000000; }
        .btn-push { background-color: #22c55e; }
        .btn-load { background-color: #ef4444; color: #ffffff;}
        
        #status-msg { color: #22c55e; font-size: 0.85rem; text-align: center; margin-bottom: 16px; font-weight: 600; width: 100%; max-width: 600px; }

        .list-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 12px; padding-bottom: 40px; }
        
        /* The Match Card Styling */
        .match-card {
            background-color: #090c13; border: 1px solid #182030; border-radius: 8px; padding: 14px;
        }
        .m-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .m1-name { color: #f59e0b; font-size: 0.95rem; font-weight: 800; text-transform: uppercase; }
        .m2-name { color: #38bdf8; font-size: 0.95rem; font-weight: 800; text-transform: uppercase; text-align: right; }
        
        .scores { display: flex; justify-content: space-between; align-items: center; }
        .score-val { font-size: 2.2rem; font-weight: 900; line-height: 1; color: #ffffff; }
        .score-box { display: flex; flex-direction: column; width: 40%; }
        .score-box.right { text-align: right; }
        .vs { font-size: 1rem; color: #64748b; font-weight: 700; text-align: center; width: 20%; }
        
        .proj { font-size: 0.8rem; color: #cbd5e1; font-weight: 600; margin-top: 6px; }
        .bench { font-size: 0.7rem; color: #94a3b8; margin-top: 2px; }
        
        .progress-bg { background-color: #121824; height: 10px; border-radius: 6px; margin: 14px 0 6px 0; display: flex; overflow: hidden; }
        .progress-bar-1 { height: 100%; transition: width 0.5s ease; }
        
        .win-pct { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 800; }
        .c1 { color: #f59e0b; }
        .c2 { color: #38bdf8; }
        .c-tie { color: #94a3b8; }
/* Modal & Pitch Styles */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: flex-end; z-index: 1000; transition: opacity 0.3s; }
        .modal-overlay.hidden { display: none; opacity: 0; }
        .modal-content { background: #121212; width: 100%; max-height: 90vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 20px; animation: slideUp 0.3s ease-out; border-top: 1px solid #333; }<head>
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px; }
        .close-btn { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
        .section-subtitle { font-size: 14px; font-weight: bold; color: #fff; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .chart-container { position: relative; height: 300px; width: 100%; }
        .pitch-layout { display: flex; gap: 15px; width: 100%; flex-direction: column; }
        .manager-pitch { flex: 1; display: flex; flex-direction: column; }
        .pitch-header { display: flex; justify-content: space-between; font-weight: bold; padding: 5px 0; font-size: 0.9rem; }
        .football-pitch { background: #0d2e1b; border: 2px solid #ffffff33; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 15px; min-height: 350px; position: relative; }
        .football-pitch::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; border-top: 2px solid #ffffff22; }
        .pitch-row { display: flex; justify-content: center; gap: 10px; z-index: 1; }
        .player-card { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .player-shirt { width: 25px; height: 25px; background: #fff; border-radius: 50%; margin-bottom: 3px; font-size: 10px; line-height: 25px; color: #000; font-weight: bold; }
        .player-name { font-size: 11px; color: #fff; background: #000; padding: 2px 4px; border-radius: 3px; }
        .player-fixture { font-size: 9px; color: #aaa; }
        .player-points { font-size: 10px; font-weight: bold; color: #ffeb3b; background: #222; padding: 2px 5px; border-radius: 3px; margin-top: 2px; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="gw-title">🔴 LIVE SCORES</h1>
        <p>Around the Grounds • Projections & Win Probability</p>
    </div>

    <div class="action-buttons">
        <button class="btn-push" id="enable-btn" onclick="subscribeUser()">🔔 Alerts</button>
        <button class="btn-load" onclick="fetchLiveScores()">🔄 Refresh Scores</button>
    </div>
    
    <div id="status-msg"></div>
    <div class="list-container" id="match-list"></div>
<!-- MATCH SPOTLIGHT MODAL -->
    <div id="match-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-match-title" style="font-size: 1.2rem;">Match Spotlight</h2>
                <button onclick="closeModal()" class="close-btn">✖</button>
            </div>
            
            <p class="section-subtitle">Gameweek Points Progression</p>
            <div class="chart-container"><canvas id="progressionChart"></canvas></div>

            <p class="section-subtitle" style="margin-top: 25px;">Pitch View</p>
            <div class="pitch-layout">
                <div class="manager-pitch">
                    <div class="pitch-header"><span id="m1-name">M1</span></div>
                    <div class="football-pitch" id="pitch-m1"></div>
                </div>
                <div class="manager-pitch">
                    <div class="pitch-header"><span id="m2-name">M2</span></div>
                    <div class="football-pitch" id="pitch-m2"></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        // ==========================================
        // 1. DATA FETCHING AND CARD RENDERING
        // ==========================================
        async function fetchLiveScores() {
            const listEl = document.getElementById("match-list");
            listEl.innerHTML = "<p style='text-align:center; color:#94a3b8;'>Running FPL Engine calculations...</p>";
            
            try {
                const response = await fetch("/api/live_scores");
                const json = await response.json();
                
                document.getElementById("gw-title").innerText = `🔴 LIVE SCORES (GW ${json.gw})`;
                listEl.innerHTML = "";
                
                json.matches.forEach(m => {
                    let c1Class = "c-tie", c2Class = "c-tie";
                    let barColor = "#94a3b8";
                    
                    if (m.pr1 > m.pr2) { 
                        c1Class = "c1"; barColor = "#f59e0b"; 
                    } else if (m.pr2 > m.pr1) { 
                        c2Class = "c2"; barColor = "#38bdf8"; 
                    }

                    listEl.innerHTML += `
                        div class="match-card" onclick="openMatchModal('${m.m1}', '${m.m2}')" style="cursor: pointer;">
                            <div class="m-header">
                                <div class="m1-name">${m.m1}</div>
                                <div class="m2-name">${m.m2}</div>
                            </div>
                            
                            <div class="scores">
                                <div class="score-box">
                                    <div class="score-val">${m.s1}</div>
                                    <div class="proj">Proj: ${m.p1.toFixed(1)} (${m.r1})</div>
                                    <div class="bench">Bench: ${m.b1} pts</div>
                                </div>
                                <div class="vs">vs</div>
                                <div class="score-box right">
                                    <div class="score-val">${m.s2}</div>
                                    <div class="proj">Proj: ${m.p2.toFixed(1)} (${m.r2})</div>
                                    <div class="bench">Bench: ${m.b2} pts</div>
                                </div>
                            </div>
                            
                            <div class="progress-bg">
                                <div class="progress-bar-1" style="width: ${m.pr1}%; background-color: ${barColor};"></div>
                            </div>
                            
                            <div class="win-pct">
                                <span class="${c1Class}">Win: ${m.pr1}%</span>
                                <span class="${c2Class}">Win: ${m.pr2}%</span>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                listEl.innerHTML = "<p style='color:#ef4444; text-align:center;'>Failed to load live scores from Python server.</p>";
            }
        }

        // ==========================================
        // 2. PUSH NOTIFICATIONS
        // ==========================================
        const VAPID_PUBLIC_KEY = "BCVBFGP0PNXvzRz9JuVB2wTj57YL8Mv_v_aSV1R6EyaswT00lPF8eQ7sDGoeI3VBcf_aAQaJXNTUkToaB7gGnNY";

        function urlBase64ToUint8Array(base64String) {
            const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
            const base64 = (base64String + padding).replace(/\-/g, "+").replace(/_/g, "/");
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        async function subscribeUser() {
            const statusEl = document.getElementById("status-msg");
            if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
                statusEl.textContent = "Push not supported on this browser.";
                return;
            }
            const registration = await navigator.serviceWorker.register("/sw.js");
            const permission = await Notification.requestPermission();
            if (permission !== "granted") {
                statusEl.textContent = "Push permission denied.";
                return;
            }
            const existingSub = await registration.pushManager.getSubscription();
            if (existingSub) await existingSub.unsubscribe();
            const subscription = await registration.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
            });
            await fetch("/api/save_subscription", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(subscription) });
            statusEl.textContent = "✅ Device registered for push alerts!";
            document.getElementById("enable-btn").style.display = "none";
        }
        
        // Auto-load scores on app startup
        window.onload = fetchLiveScores;
let currentChart = null;

        async function openMatchModal(manager1, manager2) {
            document.getElementById('match-modal').classList.remove('hidden');
            document.getElementById('modal-match-title').innerText = `${manager1} vs ${manager2}`;
            document.getElementById('m1-name').innerText = manager1;
            document.getElementById('m2-name').innerText = manager2;

            try {
                const response = await fetch(`/api/match_spotlight?m1=${manager1}&m2=${manager2}`);
                const data = await response.json();

                // Draw Chart
                const ctx = document.getElementById('progressionChart').getContext('2d');
                if (currentChart) currentChart.destroy();
                currentChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.progression.labels,
                        datasets: [
                            { label: manager1, data: data.progression.m1_data, borderColor: '#f59e0b', tension: 0, borderWidth: 2, pointRadius: 4 },
                            { label: manager2, data: data.progression.m2_data, borderColor: '#38bdf8', tension: 0, borderWidth: 2, pointRadius: 4 }
                        ]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#fff' } } }, scales: { x: { ticks: { color: '#aaa' } }, y: { ticks: { color: '#aaa' } } } }
                });

                // Draw Pitches
                renderPitch('pitch-m1', data.pitch_m1);
                renderPitch('pitch-m2', data.pitch_m2);
            } catch (error) {
                console.error("Error loading match data:", error);
            }
        }

        function closeModal() {
            document.getElementById('match-modal').classList.add('hidden');
        }

        function renderPitch(elementId, rows) {
            const pitch = document.getElementById(elementId);
            pitch.innerHTML = '';
            rows.forEach(row => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'pitch-row';
                row.forEach(p => {
                    rowDiv.innerHTML += `<div class="player-card"><div class="player-shirt">${p.pos}</div><div class="player-name">${p.name}</div><div class="player-fixture">${p.fixture}</div><div class="player-points">${p.pts} pts ${p.events}</div></div>`;
                });
                pitch.appendChild(rowDiv);
            });
        }
    </script>
</body>
</html>
